# services/hub/Cargo.toml
[package]
name = "daemon-hub"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# libp2p stack
libp2p = { version = "0.53", features = [
    "gossipsub",
    "kad",
    "noise",
    "quic",
    "macros",
    "tokio",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
ed25519-dalek = { version = "2.1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metrics
prometheus = { version = "0.13", features = ["process"] }

# Configuration
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
config = "0.14"

# Time handling
chrono = "0.4"

# Database (for message storage)
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "json"] }

# Content addressing
cid = "0.11"
multihash = "0.19"

[dev-dependencies]
rand = "0.8"
